  <text x="300" y="2560" font-family="DejaVu Sans" font-size="40" fill="#333">solid outline — chain (or back) stitch, 3 strands, golden yellow  ·  DMC 973</text>
  <text x="300" y="2622" font-family="DejaVu Sans" font-size="40" fill="#333">thin inner arcs — back stitch, 2 strands, same yellow (the plate-compartment seams)</text>
  <text x="300" y="2684" font-family="DejaVu Sans" font-size="40" fill="#333">eyes — satin fill: whites WHITE, pupils BLACK; small circle stays bare (or 1 white french knot)</text>
  <text x="300" y="2746" font-family="DejaVu Sans" font-size="40" fill="#333">bill — satin fill, orange  ·  DMC 946; nostril dashes black, 2 strands</text>
  <text x="300" y="2808" font-family="DejaVu Sans" font-size="40" fill="#333">tuft — stem stitch, 2 strands yellow</text>
  <text x="300" y="2870" font-family="DejaVu Sans" font-size="40" fill="#333">head fill is your call: outline-only (denim shows) or full yellow long-and-short = true decal</text>
  <text x="300" y="2932" font-family="DejaVu Sans" font-size="40" fill="#333">dashed circle = 6-inch hoop guide (don't stitch)  ·  square = 1 inch — check after printing</text>
</svg>
